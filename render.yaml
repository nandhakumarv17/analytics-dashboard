services:
  - type: web
    name: analytics-dashboard
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DASHBOARD_UPLOAD_DIR
        value: /tmp/dashboard_uploads
      - key: MAX_CONTENT_LENGTH
        value: "67108864"
      - key: APPS_SCRIPT_URL
        value: ""
